<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
    #captcha { min-height: 78px; }
    #status { color: #b45309; font-size: 13px; padding-top: 4px; display: none; }
  </style>
</head>
<body>
  <div id="captcha"></div>
  <div id="status"></div>
  <script>
    (function () {
      "use strict";
      let currentArgs = {};
      let widgetId = null;
      let renderedSitekey = null;
      let renderedLanguage = null;
      let scriptLoaded = false;
      let scriptLoading = false;

      function postToStreamlit(type, extra) {
        window.parent.postMessage(Object.assign({ type: type }, extra || {}), "*");
      }

      function setHeight(height) {
        postToStreamlit("streamlit:setFrameHeight", { height: height });
      }

      function showStatus(message) {
        const status = document.getElementById("status");
        status.textContent = message || "";
        status.style.display = message ? "block" : "none";
      }

      function renderCaptcha() {
        if (!scriptLoaded || !window.hcaptcha || !currentArgs.sitekey) return;
        const sitekey = currentArgs.sitekey;
        const language = currentArgs.language || "fr";
        if (widgetId !== null && sitekey === renderedSitekey && language === renderedLanguage) return;

        document.getElementById("captcha").innerHTML = "";
        showStatus("");
        widgetId = window.hcaptcha.render("captcha", {
          sitekey: sitekey,
          callback: function (token) {
            postToStreamlit("streamlit:setComponentValue", { value: token, dataType: "string" });
            setHeight(100);
          },
          "expired-callback": function () {
            postToStreamlit("streamlit:setComponentValue", { value: null, dataType: "null" });
          },
          "error-callback": function () {
            showStatus(language === "fr" ? "Le CAPTCHA n'a pas pu être chargé. Rechargez la page." : "CAPTCHA could not load. Please reload the page.");
            postToStreamlit("streamlit:setComponentValue", { value: null, dataType: "null" });
          }
        });
        renderedSitekey = sitekey;
        renderedLanguage = language;
        setHeight(100);
      }

      function loadHCaptcha() {
        if (scriptLoaded) { renderCaptcha(); return; }
        if (scriptLoading) return;
        scriptLoading = true;
        const script = document.createElement("script");
        script.src = "https://js.hcaptcha.com/1/api.js?render=explicit";
        script.async = true;
        script.defer = true;
        script.onload = function () {
          scriptLoading = false;
          scriptLoaded = true;
          renderCaptcha();
        };
        script.onerror = function () {
          scriptLoading = false;
          showStatus(currentArgs.language === "fr" ? "Impossible de charger hCaptcha. Vérifiez votre connexion puis rechargez la page." : "Unable to load hCaptcha. Check your connection and reload the page.");
          setHeight(120);
        };
        document.head.appendChild(script);
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        currentArgs = event.data.args || {};
        if (!currentArgs.sitekey) {
          showStatus(currentArgs.language === "fr" ? "Clé hCaptcha manquante." : "Missing hCaptcha site key.");
          setHeight(100);
          return;
        }
        loadHCaptcha();
      });

      // Signal readiness only after the event listener is installed.
      postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
      setHeight(100);
    })();
  </script>
</body>
</html>
