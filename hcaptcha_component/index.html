<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        #captcha-container {
            min-height: 78px;
        }

        #status {
            display: none;
            color: #b45309;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div id="captcha-container">
    <div id="captcha"></div>
</div>

<div id="status"></div>

<script>
(function () {
    "use strict";

    let currentArgs = {};
    let widgetId = null;
    let currentSitekey = null;
    let scriptLoaded = false;
    let scriptLoading = false;

    /* Communication with Streamlit */
    function sendToStreamlit(type, extra = {}) {
        window.parent.postMessage(
            Object.assign(
                {
                    isStreamlitMessage: true,
                    type: type
                },
                extra
            ),
            "*"
        );
    }

    /* Update component height */
    function setHeight(height) {
        sendToStreamlit("streamlit:setFrameHeight", {
            height: height
        });
    }

    /* Display an error message */
    function showStatus(message) {
        const status = document.getElementById("status");

        status.textContent = message || "";
        status.style.display = message ? "block" : "none";
    }

    /* Render hCaptcha */
    function renderCaptcha() {
        if (!scriptLoaded || !window.hcaptcha) {
            return;
        }

        const sitekey = currentArgs.sitekey;
        const language = currentArgs.language || "fr";

        if (!sitekey) {
            showStatus("La clé hCaptcha Site Key est manquante.");
            setHeight(120);
            return;
        }

        if (
            widgetId !== null &&
            sitekey === currentSitekey
        ) {
            return;
        }

        document.getElementById("captcha").innerHTML = "";
        showStatus("");

        try {
            widgetId = window.hcaptcha.render(
                "captcha",
                {
                    sitekey: sitekey,
                    hl: language,

                    callback: function (token) {
                        sendToStreamlit(
                            "streamlit:setComponentValue",
                            {
                                value: token,
                                dataType: "string"
                            }
                        );
                    },

                    "expired-callback": function () {
                        sendToStreamlit(
                            "streamlit:setComponentValue",
                            {
                                value: null,
                                dataType: "null"
                            }
                        );
                    },

                    "error-callback": function () {
                        showStatus(
                            "Une erreur est survenue lors de la vérification hCaptcha."
                        );

                        sendToStreamlit(
                            "streamlit:setComponentValue",
                            {
                                value: null,
                                dataType: "null"
                            }
                        );
                    }
                }
            );

            currentSitekey = sitekey;

            setHeight(100);

        } catch (error) {
            console.error("Erreur hCaptcha :", error);

            showStatus(
                "Impossible d'afficher hCaptcha."
            );

            setHeight(120);
        }
    }

    /* Load the hCaptcha JavaScript API */
    function loadHCaptcha() {
        if (scriptLoaded) {
            renderCaptcha();
            return;
        }

        if (scriptLoading) {
            return;
        }

        scriptLoading = true;

        const script = document.createElement("script");

        script.src =
            "https://js.hcaptcha.com/1/api.js?render=explicit";

        script.async = true;
        script.defer = true;

        script.onload = function () {
            scriptLoading = false;
            scriptLoaded = true;

            renderCaptcha();
        };

        script.onerror = function () {
            scriptLoading = false;

            showStatus(
                "Impossible de charger hCaptcha. Vérifiez votre connexion Internet."
            );

            setHeight(120);
        };

        document.head.appendChild(script);
    }

    /* Receive Streamlit render messages */
    window.addEventListener("message", function (event) {
        if (!event.data) {
            return;
        }

        if (event.data.type !== "streamlit:render") {
            return;
        }

        currentArgs = event.data.args || {};

        loadHCaptcha();
    });

    /* Tell Streamlit that the component is ready */
    sendToStreamlit(
        "streamlit:componentReady",
        {
            apiVersion: 1
        }
    );

    setHeight(100);

})();
</script>

</body>
</html>
